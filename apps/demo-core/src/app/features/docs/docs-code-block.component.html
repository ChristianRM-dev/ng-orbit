<section class="ng-orbit-code">
  <header class="ng-orbit-code__header">
    <div class="ng-orbit-code__title-wrap">
      @if (title()) {
        <p class="ng-orbit-code__title">{{ title() }}</p>
      }
    </div>

    @if (copyable()) {
      <button class="ng-orbit-code__copy" type="button" (click)="copyCode()">
        {{ copied() ? ('docs.shared.copied' | translate) : ('docs.shared.copy' | translate) }}
      </button>
    }
  </header>

  <pre class="ng-orbit-code__body">
    <code [class]="languageClass()" [innerHTML]="highlightedCode()"></code>
  </pre>
</section>
