<div class="ng-orbit-shell" [class.ng-orbit-shell--sidebar-open]="isSidebarOpen()">
  <button
    class="ng-orbit-shell__backdrop"
    type="button"
    aria-label="Close navigation"
    (click)="closeSidebar()"
  ></button>

  <aside class="ng-orbit-sidebar">
    <div class="ng-orbit-sidebar__brand">
      <span class="ng-orbit-sidebar__logo">ng-orbit</span>
      <span class="ng-orbit-sidebar__caption">Consumer documentation host</span>
    </div>

    <nav class="ng-orbit-sidebar__nav" aria-label="Main navigation">
      @for (item of navItems; track item.path) {
        <a
          class="ng-orbit-sidebar__item"
          routerLinkActive="ng-orbit-sidebar__item--active"
          [routerLink]="item.path"
          (click)="closeSidebar()"
        >
          {{ item.labelKey }}
        </a>
      }
    </nav>
  </aside>

  <div class="ng-orbit-shell__main">
    <header class="ng-orbit-topbar">
      <button
        class="ng-orbit-topbar__menu-toggle"
        type="button"
        aria-label="Open navigation"
        (click)="toggleSidebar()"
      >
        ☰
      </button>

      <div class="ng-orbit-topbar__title-wrap">
        <h1 class="ng-orbit-topbar__title">ng-orbit Docs</h1>
        <p class="ng-orbit-topbar__subtitle">
          Headless Angular primitives with consumer-owned UI, data, and workflows.
        </p>
      </div>
    </header>

    <main class="ng-orbit-shell__content">
      <router-outlet />
    </main>
  </div>
</div>
