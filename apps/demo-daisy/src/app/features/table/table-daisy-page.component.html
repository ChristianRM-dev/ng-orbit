<section
  class="ng-orbit-remote-content"
  orbitTable
  #table="orbitTable"
  [rows]="facade.rows()"
  [columns]="facade.columns()"
  [total]="facade.total()"
  [loading]="facade.loading()"
  [error]="facade.error()"
  [query]="facade.query()"
  [getRowId]="facade.getRowId"
  (orbitTableQueryChange)="facade.onQueryChange($event)"
  (orbitTableSelectionChange)="facade.onSelectionChange($event)"
>
  <orbit-table-render-daisy [table]="table" />
</section>
