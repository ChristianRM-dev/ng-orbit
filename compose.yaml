services:
  workspace:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_VERSION: "24"
    working_dir: /workspace
    user: root
    entrypoint:
      - /usr/local/share/ng-orbit/docker-entrypoint.sh
    init: true
    stdin_open: true
    tty: true
    environment:
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "500"
      NG_ORBIT_HOST: "0.0.0.0"
      NX_DAEMON: "false"
      NX_ISOLATE_PLUGINS: "false"
    volumes:
      - .:/workspace:cached
      - node_modules:/workspace/node_modules
      - pnpm-store:/pnpm/store
      - angular-cache:/workspace/.angular
      - nx-cache:/workspace/.nx
    ports:
      - "4200:4200"
      - "4201:4201"
      - "4202:4202"
    command: /bin/bash -lc "pnpm install && pnpm demo:docker"

volumes:
  angular-cache:
  node_modules:
  nx-cache:
  pnpm-store:
